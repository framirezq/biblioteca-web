<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de Francisco Ramírez Quintero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{--papel:#f4ecd8;--papel2:#fbf6ea;--tinta:#3b2a1a;--suave:#7a6248;--oro:#b08d3c;--granate:#7a1f2b;--madera:#6b4423;--madera2:#4a2e17;--borde:#b9a88a}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:'EB Garamond',Georgia,serif;font-size:18px;line-height:1.5}
a{color:var(--granate)}
.marco{max-width:1100px;margin:0 auto;padding:16px}
header{border:2px solid var(--tinta);outline:1px solid var(--tinta);outline-offset:-8px;text-align:center;padding:28px 16px 20px;margin:12px 0 18px}
header .ex{letter-spacing:.4em;font-size:13px;color:var(--suave)}
header h1{font-weight:400;font-size:clamp(26px,4.5vw,40px);margin:6px 0}
header .orn{color:var(--oro)}
header .sub{font-style:italic;color:var(--suave)}
.registro{display:flex;flex-wrap:wrap;justify-content:center;border-top:1px solid var(--borde);border-bottom:1px solid var(--borde);margin:0 0 18px}
.registro div{flex:1 1 110px;text-align:center;padding:10px 4px;border-left:1px solid var(--borde)}
.registro div:first-child{border-left:none}
.registro b{display:block;font-size:30px;font-weight:400}
.registro span{font-size:11px;letter-spacing:.15em;color:var(--suave);text-transform:uppercase}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
nav button{font:inherit;font-size:15px;letter-spacing:.12em;text-transform:uppercase;background:none;border:1px solid var(--borde);color:var(--suave);padding:6px 16px;cursor:pointer}
nav button.activo{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.seccion{display:none}.seccion.activa{display:block}
.buscador{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.buscador input,.buscador select{font:inherit;font-size:16px;background:var(--papel2);border:1px solid var(--borde);color:var(--tinta);padding:6px 10px}
.buscador input{flex:1 1 220px}
h2{font-weight:400;letter-spacing:.2em;font-size:14px;color:var(--suave);text-transform:uppercase;margin:22px 0 6px}
.repisa{display:flex;flex-wrap:wrap;align-items:flex-end;gap:3px;padding:0 10px;border-bottom:14px solid var(--madera);box-shadow:0 4px 0 var(--madera2);margin-bottom:26px;min-height:60px}
.lomo{writing-mode:vertical-rl;transform:rotate(180deg);color:#f1e3c0;font-size:12.5px;padding:14px 5px;border-radius:2px;cursor:pointer;
 overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-top:2px solid var(--oro);border-bottom:2px solid var(--oro);
 box-shadow:inset -3px 0 0 rgba(0,0,0,.18);transition:transform .15s, filter .15s}
.lomo:hover,.lomo:focus{transform:rotate(180deg) translateY(8px);filter:brightness(1.15);outline:none}
.lomo.fantasma{background:transparent!important;color:var(--suave);border:1px dashed var(--suave)}
.lomo.apagado{opacity:.18}
.leyenda{font-size:14px;color:var(--suave);font-style:italic}
.leyenda i{display:inline-block;width:12px;height:12px;margin:0 4px 0 12px;vertical-align:-1px}
#mapa{width:100%;height:auto;background:var(--papel);border:1px solid var(--borde)}
#mapa .mar{fill:#e9dcbd;stroke:var(--suave)}#mapa .reticula{fill:none;stroke:var(--suave);stroke-width:.35;stroke-dasharray:2 3;opacity:.6}
#mapa .sin{fill:#efe3c6;stroke:#a89070;stroke-width:.35}
#mapa .con{stroke:var(--tinta);stroke-width:.5;cursor:pointer;transition:filter .15s}
#mapa .con:hover,#mapa .con.sel{filter:brightness(1.25);stroke-width:1.2}
.mapa-caja{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:820px){.mapa-caja{grid-template-columns:1fr}}
.panel{background:var(--papel2);border:1px solid var(--borde);padding:12px 16px;max-height:520px;overflow:auto}
.panel h3{font-weight:400;font-size:24px;margin:0 0 4px}
.panel .autor{margin-top:10px}.panel .autor b{font-weight:600}
.panel ul{margin:4px 0 0;padding-left:18px}.panel li{cursor:pointer}.panel li:hover{text-decoration:underline}
.zoom{margin:8px 0;display:flex;gap:6px}.zoom button{font:inherit;font-size:14px;background:none;border:1px solid var(--borde);color:var(--suave);padding:3px 10px;cursor:pointer}
#tip{position:fixed;pointer-events:none;background:var(--tinta);color:var(--papel);font-size:14px;padding:3px 8px;display:none;z-index:5}
table{width:100%;border-collapse:collapse;font-size:16px}
th{font-weight:400;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--suave);text-align:left;border-bottom:1px solid var(--tinta);padding:6px;cursor:pointer}
td{border-bottom:1px solid #e3d5b5;padding:6px;vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--papel2)}
.velo{position:fixed;inset:0;background:rgba(59,42,26,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.velo.abierto{display:flex}
.ficha{background:var(--papel2);max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px 26px 18px;border-top:6px solid var(--granate);
 box-shadow:0 10px 30px rgba(0,0,0,.3);font-family:'Courier Prime',monospace;font-size:15px;
 background-image:repeating-linear-gradient(transparent 0 25px,#d9e2ef 25px 26px);line-height:26px;position:relative}
.ficha .cerrar{position:absolute;right:12px;top:8px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--suave)}
.ficha .sig{position:absolute;right:20px;top:34px;font-size:12px;color:var(--suave)}
.ficha h3{font-family:'EB Garamond',serif;font-weight:600;font-size:26px;line-height:1.2;margin:0 0 4px;padding-right:40px}
.ficha .aut{font-size:16px}.ficha dl{display:grid;grid-template-columns:130px 1fr;margin:10px 0}.ficha dt{color:var(--suave)}.ficha dd{margin:0}
.ficha .res{font-family:'EB Garamond',serif;font-size:18px;line-height:26px}
.chip{display:inline-block;border:1px solid var(--borde);font-size:13px;line-height:20px;padding:0 8px;margin:2px 4px 2px 0;background:var(--papel)}
.estrellas{color:var(--oro);letter-spacing:2px}
footer{text-align:center;font-size:14px;color:var(--suave);font-style:italic;margin:30px 0 10px}
</style></head><body><div class="marco">

<div class="registro" id="registro"></div>
<nav><button data-s="estanteria" class="activo">Estantería</button><button data-s="mapa-s">Mapa</button><button data-s="catalogo">Catálogo</button></nav>

<select id="fEstado" aria-label="Estado"></select><select id="fTema" aria-label="Temática"></select><select id="fGenero" aria-label="Género"></select><select id="fPais" aria-label="País"></select></div>
<section class="seccion activa" id="estanteria"><div class="leyenda" id="leyenda"></div><div id="repisas"></div></section>

a Ilíada, narra sus viajes y la guerra contra los pueblos del Lacio.", "fuente_resumen": "https://es.wikipedia.org/wiki/Eneida", "autores": ["Virgilio"], "pais": ["Antigua Roma"], "tematica": ["literatura"], "temas": ["guerra", "fundación", "mito", "destino", "virtud", "piedad"], "lista": "Libros", "id": 35, "h": 779}, {"titulo": "Ensayo sobre la ceguera", "estado": "leído", "año": "1995", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "Ensayo sobre la ceguera es una novela que sigue a un grupo de personas que se vuelven ciegas de forma misteriosa. La historia explora cómo la ceguera física afecta la conducta y las relaciones humanas. La novela también refleja la deshumanización y el egoísmo en una sociedad desencajada.", "fuente_resumen": "https://es.wikipedia.org/wiki/Ensayo_sobre_la_ceguera", "autores": ["José Saramago"], "pais": ["Portugal"], "tematica": ["literatura"], "temas": ["ceguera", "sociedad", "egoísmo", "supervivencia", "identidad", "deshumanización"], "lista": "Libros", "id": 36, "h": 834}, {"titulo": "Erecciones, Eyaculaciones, Exhibiciones", "estado": "leyendo", "año": "", "genero": "", "editorial": "Editorial Anagrama", "isbn": "9788433914552", "año_edicion": "1995", "paginas": "186", "calificacion": "", "resumen_ia": "", "fuente_resumen": "", "autores": ["Charles Bukowski"], "pais": ["Estados Unidos"], "tematica": ["literatura"], "temas": [], "lista": "Libros", "id": 37, "h": 883}, {"titulo": "Factotum", "estado": "por leer", "año": "1975", "genero": "novela", "editorial": "Editorial Anagrama", "isbn": "9788433920058", "año_edicion": "1989", "paginas": "192", "calificacion": "", "resumen_ia": "Henry Chinaski, alter ego de Bukowski, recorre Estados Unidos encadenando trabajos precarios de los que siempre acaba despedido. Entre el alcohol, las mujeres y el rechazo a la rutina, la novela retrata la vida marginal con humor seco y crudeza.", "fuente_resumen": "https://es.wikipedia.org/wiki/Fact%C3%B3tum_%28novela%29", "autores": ["Charles Bukowski"], "pais": ["Estados Unidos"], "tematica": ["literatura"], "temas": ["trabajo", "marginalidad", "alcohol", "rechazo", "humor"], "lista": "Libros", "id": 38, "h": 631}, {"titulo": "Fahrenheit 451", "estado": "por leer", "año": "1953", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "En un futuro distópico, los libros son prohibidos y los bomberos los queman. El protagonista, un bombero, se convierte en un defensor de la literatura y la cultura. La novela explora la censura y la pérdida de conocimiento.", "fuente_resumen": "https://openlibrary.org/works/OL103123W", "autores": ["Ray Bradbury"], "pais": ["Estados Unidos"], "tematica": ["literatura"], "temas": ["censura", "libertad", "conocimiento", "propaganda", "sociedad", "literatura"], "lista": "Libros", "id": 39, "h": 82}, {"titulo": "Ficciones", "estado": "por leer", "año": "1944", "genero": "cuentos", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "Ficciones es un libro de cuentos que explora conceptos como el tiempo, la realidad y la ficción. Cada historia desafía la percepción del lector sobre lo real y lo imaginario. Los relatos se desarrollan con una narrativa compleja y simbólica.", "fuente_resumen": "https://es.wikipedia.org/wiki/Ficciones", "autores": ["Jorge Luis Borges"], "pais": ["Argentina"], "tematica": ["literatura"], "temas": ["tiempo", "laberintos", "infinito", "realidad", "ficción", "erudición"], "lista": "Libros", "id": 40, "h": 615}, {"titulo": "Fuenteovejuna", "estado": "por leer", "año": "1619", "genero": "teatro", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "Fuenteovejuna es una obra teatral que narra la resistencia colectiva de un pueblo contra la opresión. La trama se desarrolla en un pueblo cordobés durante el reinado de los Reyes Católicos. El drama muestra la unión de los habitantes para enfrentar una injusticia.", "fuente_resumen": "https://es.wikipedia.org/wiki/Fuenteovejuna", "autores": ["Lope de Vega"], "pais": ["España"], "tematica": ["literatura"], "temas": ["opresión", "resistencia", "pueblo", "justicia", "unión", "historia"], "lista": "Libros", "id": 41, "h": 16}, {"titulo": "Guerra y paz", "estado": "por leer", "año": "1865", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "Guerra y paz narra las vidas de varios personajes rusos durante las guerras napoleónicas y los años siguientes. Tolstói explora cómo las grandes fuerzas históricas afectan a las vidas individuales.", "fuente_resumen": "https://es.wikipedia.org/wiki/Guerra_y_paz", "autores": ["León Tolstói"], "pais": ["Rusia"], "tematica": ["literatura"], "temas": ["guerra", "paz", "historia", "individuo", "sociedad", "destino"], "lista": "Libros", "id": 42, "h": 85}, {"titulo": "Historias y no me olvides", "estado": "por leer", "año": "", "genero": "", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "", "fuente_resumen": "", "autores": ["Jairo Aníbal Niño"], "pais": ["Colombia"], "tematica": ["literatura"], "temas": [], "lista": "Libros", "id": 43, "h": 762}, {"titulo": "Hojas de hierba", "estado": "leyendo", "año": "1855", "genero": "poesía", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "Hojas de hierba es un libro de poemas que celebra la vida, el cuerpo y la humanidad. Whitman explora la conexión entre el individuo y el mundo a través de una poesía que valora lo material y lo sensorial.", "fuente_resumen": "https://es.wikipedia.org/wiki/Hojas_de_hierba", "autores": ["Walt Whitman"], "pais": ["Estados Unidos"], "tematica": ["poesía"], "temas": ["vida", "cuerpo", "humanidad", "naturaleza", "individualidad", "espíritu"], "lista": "Libros", "id": 44, "h": 383}, {"titulo": "Indigno de ser humano", "estado": "por leer", "año": "1948", "genero": "novela", "editorial": "DG Editores", "isbn": "9786280213217", "año_edicion": "2025", "paginas": "", "calificacion": "", "resumen_ia": "A través de tres cuadernos, Ōba Yōzō cuenta su vida desde la infancia: incapaz de entender a los demás, se esconde detrás del papel de bufón, y su alienación lo arrastra al alcohol, a relaciones destructivas y a intentos de acabar con su vida. Es la última novela que Dazai terminó y una de las más leídas de la literatura japonesa.", "fuente_resumen": "", "autores": ["Osamu Dazai"], "pais": ["Japón"], "tematica": ["literatura"], "temas": ["alienación", "identidad", "soledad", "autodestrucción", "Japón"], "lista": "Libros", "id": 45, "h": 212}, {"titulo": "Juntacadáveres", "estado": "por leer", "año": "", "genero": "", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "", "fuente_resumen": "", "autores": ["Juan Carlos Onetti"], "pais": ["Uruguay"], "tematica": ["literatura"], "temas": [], "lista": "Libros", "id": 46, "h": 63}, {"titulo": "La Odisea", "estado": "leído", "año": "", "genero": "epopeya", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "La Odisea narra el viaje de retorno de Odiseo tras la guerra de Troya, enfrentando diversos peligros y desafíos. Mientras él viaja, su esposa Penélope y su hijo Telémaco luchan contra los pretendientes que desean casarse con ella. Su astucia y la ayuda de los dioses le permiten finalmente regresar a su tierra natal.", "fuente_resumen": "https://es.wikipedia.org/wiki/Odisea", "autores": ["Homero"], "pais": ["Antigua Grecia"], "tematica": ["literatura"], "temas": ["nostos", "xenia", "astucia", "hospitalidad", "regreso", "viaje"], "lista": "Libros", "id": 47, "h": 25}, {"titulo": "La caída", "estado": "por leer", "año": "1956", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "En un bar de Ámsterdam, Jean-Baptiste Clamence, antiguo abogado parisino de éxito, cuenta su vida a un desconocido en un largo monólogo. Su confesión revela cómo un episodio de indiferencia destruyó la imagen virtuosa que tenía de sí mismo y lo llevó a reflexionar sobre la culpa.", "fuente_resumen": "https://es.wikipedia.org/wiki/La_ca%C3%ADda_%28novela%29", "autores": ["Albert Camus"], "pais": ["Francia"], "tematica": ["literatura", "filosofía"], "temas": ["culpa", "hipocresía", "confesión", "juicio", "existencialismo"], "lista": "Libros", "id": 48, "h": 461}, {"titulo": "La divina comedia", "estado": "por leer", "año": "", "genero": "epopeya", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "La Divina Comedia es un poema escrito por Dante Alighieri que narra un viaje ficticio a través de tres mundos: el Infierno, el Purgatorio y el Paraíso. El poema refleja la visión medieval del cosmos y la salvación del alma. El viaje simboliza la búsqueda espiritual del autor.", "fuente_resumen": "https://es.wikipedia.org/wiki/Divina_comedia", "autores": ["Dante Alighieri"], "pais": ["Italia"], "tematica": ["literatura"], "temas": ["viaje", "salvación", "cosmos", "alma", "moral", "religión"], "lista": "Libros", "id": 49, "h": 852}, {"titulo": "La espuma de los días", "estado": "por leer", "año": "1947", "genero": "novela", "editorial": "Alianza", "isbn": "9788420688114", "año_edicion": "2019", "paginas": "232", "calificacion": "", "resumen_ia": "En un París fantástico donde los objetos cobran vida, Colin se enamora y se casa con Chloé. Cuando a ella le crece un nenúfar en el pulmón, el mundo luminoso de la pareja empieza a encogerse y a oscurecerse.", "fuente_resumen": "https://es.wikipedia.org/wiki/La_espuma_de_los_d%C3%ADas", "autores": ["Boris Vian"], "pais": ["Francia"], "tematica": ["literatura"], "temas": ["amor", "enfermedad", "jazz", "fantasía", "surrealismo"], "lista": "Libros", "id": 50, "h": 234}, {"titulo": "La guerra n Kundera"], "pais": ["República Checa", "Francia"], "tematica": ["literatura"], "temas": ["amor", "levedad", "eterno retorno", "libertad", "Praga", "política"], "lista": "Libros", "id": 53, "h": 629}, {"titulo": "La ligereza", "estado": "por leer", "año": "", "genero": "", "editorial": "Periférica", "isbn": "9788410171145", "año_edicion": "2024", "paginas": "128", "calificacion": "", "resumen_ia": "", "fuente_resumen": "", "autores": ["Juan Cárdenas"], "pais": ["Colombia"], "tematica": ["literatura"], "temas": [], "lista": "Libros", "id": 54, "h": 248}, {"titulo": "La muerte de Iván Ilich y otros relatos", "estado": "por leer", "año": "", "genero": "", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "", "fuente_resumen": "", "autores": ["León Tolstói"], "pais": ["Rusia"], "tematica": ["literatura"], "temas": [], "lista": "Libros", "id": 55, "h": 730}, {"titulo": "La peste", "estado": "leído", "año": "1947", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "La peste describe una epidemia que azota la ciudad de Orán, mostrando cómo afecta a diferentes personas. Los personajes exploran la crisis y sus implicaciones en la vida cotidiana. El libro plantea reflexiones sobre el destino y la condición humana.", "fuente_resumen": "https://openlibrary.org/works/OL1230715W", "autores": ["Albert Camus"], "pais": ["Francia"], "tematica": ["literatura"], "temas": ["plaga", "destino", "condición humana", "crisis", "sociedad", "respuesta"], "lista": "Libros", "id": 56, "h": 804}, {"titulo": "La rebelión de las ratas", "estado": "por leer", "año": "1962", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "La Rebelión de las Ratas narra la historia de Timbalí, un pueblo ficticio controlado por multinacionales mineras. La novela explora la resistencia de la comunidad frente a la explotación. Se centra en la lucha por la supervivencia y la identidad local.", "fuente_resumen": "https://es.wikipedia.org/wiki/La_rebeli%C3%B3n_de_las_ratas", "autores": ["Fernando Soto Aparicio"], "pais": ["Colombia"], "tematica": ["literatura"], "temas": ["resistencia", "explotación", "identidad", "lucha", "control", "comunidad"], "lista": "Libros", "id": 57, "h": 777}, {"titulo": "La ridícula idea de no volver a verte", "estado": "por leer", "año": "2013", "genero": "crónica", "editorial": "Seix Barral", "isbn": "9789584235701", "año_edicion": "2013", "paginas": "237", "calificacion": "", "resumen_ia": "Rosa Montero entrelaza el diario que Marie Curie escribió tras la muerte de su esposo Pierre con su propio duelo por la muerte de su marido. El libro reflexiona sobre la pérdida, la ciencia, la condición de las mujeres y la manera de seguir viviendo.", "fuente_resumen": "https://es.wikipedia.org/wiki/La_rid%C3%ADcula_idea_de_no_volver_a_verte", "autores": ["Rosa Montero"], "pais": ["España"], "tematica": ["literatura"], "temas": ["duelo", "Marie Curie", "mujeres", "ciencia", "memoria"], "lista": "Libros", "id": 58, "h": 482}, {"titulo": "La senda del perdedor", "estado": "leído", "año": "1982", "genero": "novela", "editorial": "Editorial Anagrama", "isbn": "9788433914699", "año_edicion": "1996", "paginas": "287", "calificacion": "", "resumen_ia": "La senda del perdedor narra la vida de Henry Chinaski, alter ego de Bukowski, durante sus primeros veinte años en Los Ángeles. El libro refleja la vida de un hombre marginado en una sociedad dura y despiadada. La prosa es directa y refleja la realidad de la vida de los marginados.", "fuente_resumen": "https://es.wikipedia.org/wiki/La_senda_del_perdedor", "autores": ["Charles Bukowski"], "pais": ["Estados Unidos"], "tematica": ["literatura"], "temas": ["vida marginal", "sociedad", "desesperación", "realismo", "autobiografía", "los ángeles"], "lista": "Libros", "id": 59, "h": 665}, {"titulo": "La sociedad del cansancio", "estado": "por leer", "año": "", "genero": "ensayo", "editorial": "Herder", "isbn": "9789586657303", "año_edicion": "2022", "paginas": "118", "calificacion": "", "resumen_ia": "Byung-Chul Han sostiene que la sociedad disciplinaria ha dado paso a una sociedad del rendimiento, donde cada persona se explota a sí misma creyendo que es libre. El resultado es un cansancio generalizado y enfermedades como la depresión, el TDAH o el síndrome de desgaste profesional.", "fuente_resumen": "https://es.wikipedia.org/wiki/La_sociedad_del_cansancio", "autores": ["Byung-Chul Han"], "pais": ["Corea del Sur", "Alemania"], "tematica": ["filosofía"], "temas": ["rendimiento", "autoexplotación", "cansancio", "depresión", "sociedad contemporánea"], "lista": "Libros", "id": 60, "h": 299}, {"titulo": "La tonalidad del pensamiento", "estado": "por leer", "año": "", "genero": "", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "", "fuente_resumen": "", "autores": ["Byung-Chul Han"], "pais": ["Corea del Sur", "Alemania"], "tematica": ["filosofía"], "temas": [], "lista": "Libros", "id": 61, "h": 522}, {"titulo": "Las cenizas de Ángela", "estado": "por leer", "año": "1996", "genero": "memorias", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "Las cenizas de Ángela es un libro de memorias que relata la infancia de Frank McCourt en Irlanda. Describe la pobreza y los desafíos de su familia. El libro aborda la lucha por sobrevivir en un entorno difícil.", "fuente_resumen": "https://es.wikipedia.org/wiki/Las_cenizas_de_%C3%81ngela", "autores": ["Frank McCourt"], "pais": ["Irlanda", "Estados Unidos"], "tematica": ["literatura"], "temas": ["pobreza", "familia", "infancia", "irlanda", "sobrevivencia", "memorias"], "lista": "Libros", "id": 62, "h": 302}, {"titulo": "Las intermitencias de la muerte", "estado": "leído", "año": "2005", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "En un país sin nombre, a partir del primer día del año la gente deja de morir. Lo que parece una bendición desata el caos en hospitales, funerarias, aseguradoras, la Iglesia y el gobierno, y Saramago lo usa para reflexionar con ironía sobre la vida y la muerte.", "fuente_resumen": "https://es.wikipedia.org/wiki/Las_intermitencias_de_la_muerte", "autores": ["José Saramago"], "pais": ["Portugal"], "tematica": ["literatura"], "temas": ["muerte", "inmortalidad", "sociedad", "ironía", "poder"], "lista": "Libros", "id": 63, "h": 570}, {"titulo": "Las venas abiertas de América Latina", "estado": "por leer", "año": "1971", "genero": "ensayo", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "El libro analiza la historia de América Latina desde la colonización hasta la actualidad, destacando el saqueo de sus recursos por parte de imperios coloniales e imperialistas. Combina crónicas y narraciones para mostrar la explotación constante de la región.", "fuente_resumen": "https://es.wikipedia.org/wiki/Las_venas_abiertas_de_Am%C3%A9rica_Latina", "autores": ["Eduardo Galeano"], "pais": ["Uruguay"], "tematica": ["sociología"], "temas": ["colonización", "explotación", "imperialismo", "historia", "recursos naturales", "saqueo"], "lista": "Libros", "id": 64, "h": 382}, {"titulo": "Las ventajas de viajar en tren", "estado": "por leer", "año": "2000", "genero": "novela", "editorial": "TUSQUETS", "isbn": "9788490661314", "año_edicion": "2015", "paginas": "152", "calificacion": "", "resumen_ia": "Helga Pato, que acaba de internar a su marido en un psiquiátrico, conoce en un tren a un hombre que dice ser psiquiatra y empieza a contarle historias delirantes. Los relatos se encadenan unos con otros en una novela de humor negro sobre la locura y la manera de contar.", "fuente_resumen": "", "autores": ["Antonio Orejudo"], "pais": ["España"], "tematica": ["literatura"], "temas": ["locura", "humor negro", "relatos encadenados", "metaficción"], "lista": "Libros", "id": 65, "h": 388}, {"titulo": "Las voladoras", "estado": "por leer", "año": "2020", "genero": "cuentos", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "Las voladoras es un libro de cuentos que explora temas como los feminicidios, la violencia doméstica y el duelo a través de relatos ambientados en el mundo andino. Cada historia se desarrolla en un contexto de misticismo y terror, con un estilo definido como gótico andino.", "fuente_resumen": "https://es.wikipedia.org/wiki/Las_voladoras", "autores": ["Mónica Ojeda"], "pais": ["Ecuador"], "tematica": ["literatura"], "temas": ["misticismo", "violencia", "duelo", "ritos ancestrales", "tabúes", "terror"], "lista": "Libros", "id": 66, "h": 810}, {"titulo": "Los Simpson y la filosofía", "estado": "por leer", "año": "2001", "genero": "ensayo", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "El libro analiza la filosofía y las influencias culturales de la serie Los Simpson. Se compone de dieciocho ensayos escritos por distintos autores. Se publicó como parte de una serie de Open Court sobre temas filosóficos y culturales.", "fuente_resumen": "https://es.wikipedia.org/wiki/The_Simpsons_and_Philosophy%3A_The_D%27oh%21_of_Homer", "autores": ["William Irwin"], "pais": ["Estados Unidos"], "tematica": ["filosofía"], "temas": ["filosofía", "cultura popular", "televisión", "ética", "sátira"], "lista": "Libros", "id": 67, "h": 681}, {"titulo": "Los hermanos Karamázov", "estado": "leyendo", "año": "1880", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "Los hermanos Karamazov es una novela que explora temas éticos y espirituales en la Rusia del siglo XIX, centrada en un drama de luchas morales y fe. La trama gira en torno a un parricidio y las tensiones entre la religión y la razón.", "fuente_resumen": "https://es.wikipedia.org/wiki/Los_hermanos_Karamazov", "autores": ["Fiódor Dostoyevski"], "pais": ["Rusia"], "tematica": ["literatura"], "temas": ["fe", "duda", "moralidad", "libre albedrío", "ética", "dios"], "lista": "Libros", "id": 68, "h": 28}, {"titulo": "Los pasos perdidos", "estado": "por leer", "año": "1953", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "Un compositor que lleva una vida vacía en una gran ciudad emprende un viaje por la selva sudamericana en busca de unos instrumentos musicales primitivos. A medida que remonta el río, siente que viaja hacia atrás en el tiempo y se replantea su lugar en el mundo.", "fuente_resumen": "https://openlibrary.org/works/OL580046W", "autores": ["Alejo Carpentier"], "pais": ["Cuba"], "tematica": ["literatura"], "temas": ["viaje", "tiempo", "civilización", "selva", "música", "origen"], "lista": "Libros", "id": 69, "h": 317}, {"titulo": "Los viajes de Gulliver", "estado": "por leer", "año": "1726", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "El libro narra los viajes de Gulliver a distintas naciones extranjeras, donde describe sociedades y costumbres exóticas. Swift utiliza estas historias para criticar la sociedad europea y la naturaleza humana. El relato se estructura en cuatro partes.", "fuente_resumen": "https://es.wikipedia.org/wiki/Los_viajes_de_Gulliver", "autores": ["Jonathan Swift"], "pais": ["Irlanda"], "tematica": ["literatura"], "temas": ["sátira", "sociedad", "viajes", "crítica", "humanidad", "naciones"], "lista": "Libros", "id": 70, "h": 805}, {"titulo": "Líbranos del bien", "estado": "por leer", "año": "", "genero": "", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "", "fuente_resumen": "", "autores": ["Alonso Sánchez Baute"], "pais": ["Colombia"], "tematica": ["literatura"], "temas": [], "lista": "Libros", "id": 71, "h": 114}, {"titulo": "Maus", "estado": "por leer", "año": "1991", "genero": "novela gráfica", "editorial": "", "isbn": "9789585982673", "año_edicion": "2019", "paginas": "295", "calificacion": "", "resumen_ia": "Maus es la historia real de Vladek Spiegelman, un judío polaco superviviente del Holocausto, narrada por su hijo Art. La obra explora la relación entre padre e hijo y las experiencias de Vladek durante la guerra.", "fuente_resumen": "https://es.wikipedia.org/wiki/Maus", "autores": ["Art Spiegelman"], "pais": ["Estados Unidos"], "tematica": ["cómic"], "temas": ["holocausto", "relación padre-hijo", "memoria", "historia", "autobiografía", "cómic"], "lista": "Libros", "id": 72, "h": 463}, {"titulo": "Me llamo Rojo", "estado": "por leer", "año": "1998", "genero": "novela", "editorial": "Debolsillo", "isbn": "9789589016268", "año_edicion": "2026", "paginas": "514", "calificacion": "", "resumen_ia": "En la Estambul otomana de 1591, un grupo de miniaturistas trabaja en secreto en un libro para el sultán cuando uno de ellos es asesinado. Contada por muchas voces, incluso por objetos y colores, la novela combina intriga policial, historia del arte y el choque entre Oriente y Occidente.", "fuente_resumen": "https://es.wikipedia.org/wiki/Me_llamo_Rojo", "autores": ["Orhan Pamuk"], "pais": ["Turquía"], "tematica": ["literatura"], "temas": ["arte", "Imperio otomano", "Oriente y Occidente", "crimen", "religión"], "lista": "Libros", "id": 73, "h": 300}, {"titulo": "Memorias del subsuelo", "estado": "por leer", "año": "1864", "genero": "novela", "editorial": "SKLA", "isbn": "9789587232486", "año_edicion": "2022", "paginas": "158", "calificacion": "", "resumen_ia": "Un exfuncionario amargado y solitario de San Petersburgo escribe desde su «subsuelo» un monólogo contra la razón, el progreso y la idea de que el ser humano actúa siempre por su propio interés. En la segunda parte recuerda episodios humillantes de su juventud.", "fuente_resumen": "https://es.wikipedia.org/wiki/Memorias_del_subsuelo", "autores": ["Fiódor Dostoyevski"], "pais": ["Rusia"], "tematica": ["literatura"], "temas": ["conciencia", "libre albedrío", "resentimiento", "soledad", "existencialismo"], "lista": "Libros", "id": 74, "h": 735}, {"titulo": "Mil soles espléndidos", "estado": "por leer", "año": "2007", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "En Afganistán, a lo largo de tres décadas de guerra, se cruzan las vidas de Mariam y Laila, dos mujeres de generaciones distintas obligadas a casarse con el mismo hombre. Su relación pasa de la rivalidad a una profunda amistad frente a la violencia y la opresión.", "fuente_resumen": "https://es.wikipedia.org/wiki/Mil_soles_espl%C3%A9ndidos", "autores": ["Khaled Hosseini"], "pais": ["Afganistán", "Estados Unidos"], "tematica": ["literatura"], "temas": ["mujeres", "Afganistán", "guerra", "violencia", "amistad", "maternidad"], "lista": "Libros", "id": 75, "h": 933}, {"titulo": "Nieve", "estado": "por leer", "año": "2002", "genero": "", "editorial": "Debolsillo", "isbn": "9789589016084", "año_edicion": "2016", "paginas": "514", "calificacion": "", "resumen_ia": "", "fuente_resumen": "", "autores": ["Orhan Pamuk"], "pais": ["Turquía"], "tematica": ["literatura"], "temas": [], "lista": "Libros", "id": 76, "h": 552}, {"titulo": "Nocturno de Chile", "estado": "leído", "año": "2000", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "En una noche de fiebre, el sacerdote y crítico literario Sebastián Urrutia Lacroix repasa su vida en un monólogo sin pausas. Su recuerdo de la vida cultural chilena, que incluye haber dado clases de marxismo a la junta militar, expone la complicidad de los intelectuales con la dictadura.", "fuente_resumen": "https://es.wikipedia.org/wiki/Nocturno_de_Chile", "autores": ["Roberto Bolaño"], "pais": ["Chile"], "tematica": ["literatura"], "temas": ["dictadura", "literatura", "complicidad", "culpa", "Chile"], "lista": "Libros", "id": 77, "h": 1}, {"titulo": "Nuestra parte de noche", "estado": "por leer", "año": "", "genero": "", "editorial": "Anagrama", "isbn": "9788433998859", "año_edicion": "2019", "paginas": "", "calificacion": "", "resumen_ia": "", "fuente_resumen": "", "autores": ["Mariana Enríquez"], "pais": [], "tematica": [], "temas": [], "lista": "Libros", "id": 78, "h": 49}, {"titulo": "Nueva visita a un mundo feliz", "estado": "por leer", "año": "1958", "genero": "ensayo", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "El libro examina la novela 'Un mundo feliz' de Huxley, analizando su contenido y reflexionando sobre su relevancia veintiséis años después. Huxley compara su obra con '1984' de Orwell, destacando las diferencias en la visión de la sociedad distópica.", "fuente_resumen": "https://es.wikipedia.org/wiki/Nueva_visita_a_un_mundo_feliz", "autores": ["Aldous Huxley"], "pais": ["Reino Unido"], "tematica": ["literatura"], "temas": ["sociedad", "distopía", "comparación", "civilización", "ensayo", "libertad"], "lista": "Libros", "id": 79, "h": 817}, {"titulo": "Obra selecta", "estado": "por leer", "año": "", "genero": "", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "", "fuente_resumen": "", "autores": ["Hermann Hesse"], "pais": ["Alemania", "Suiza"], "tematica": ["literatura"], "temas": [], "lista": "Libros", "id": 80, "h": 275}, {"titulo": "Papillon", "estado": "leído", "año": "1969", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "El libro narra la vida de un hombre condenado a prisión en una isla desolada, Cayena, donde la vida es dura y la fuga parece imposible. Tras sufrir mucho, logra escapar de ese lugar.", "fuente_resumen": "https://openlibrary.org/works/OL262984W", "autores": ["Henri Charrière"], "pais": ["Francia"], "tematica": ["literatura"], "temas": ["pr ficacion": "", "resumen_ia": "La relación entre Horacio Oliveira y la Maga en París y el regreso de Oliveira a Buenos Aires. Cortázar propone dos maneras de leer el libro —de corrido o saltando capítulos según un tablero de dirección—, de modo que el lector participa en la construcción de la novela.", "fuente_resumen": "https://es.wikipedia.org/wiki/Rayuela_%28novela%29", "autores": ["Julio Cortázar"], "pais": ["Argentina", "Francia"], "tematica": ["literatura"], "temas": ["amor", "búsqueda", "lectura", "París", "Buenos Aires", "experimentación"], "lista": "Libros", "id": 86, "h": 14}, {"titulo": "Resurrección", "estado": "leído", "año": "1899", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "El príncipe Nejliúdov forma parte del jurado en el juicio de Katiusha Máslova, una joven a la que sedujo y abandonó años atrás y que ahora es acusada injustamente de asesinato. Arrepentido, intenta redimirse, y Tolstói aprovecha su recorrido para criticar la justicia, las cárceles y la Iglesia.", "fuente_resumen": "https://es.wikipedia.org/wiki/Resurrecci%C3%B3n_%28novela%29", "autores": ["León Tolstói"], "pais": ["Rusia"], "tematica": ["literatura"], "temas": ["redención", "justicia", "culpa", "religión", "sociedad rusa"], "lista": "Libros", "id": 87, "h": 750}, {"titulo": "Rojo y negro", "estado": "leyendo", "año": "1830", "genero": "novela", "editorial": "", "isbn": "", "año_edicion": "", "paginas": "", "calificacion": "", "resumen_ia": "Rojo y negro narra la vida de Julien Sorel, un campesino que logra ascender socialmente mediante su inteligencia y manipulación, mientras desarrolla una admiración excesiva por Napoleón. La novela explora la sociedad francesa de la Restauración borbónica, destacando contrastes entre clases y religiones.", "fuente_resumen": "https://es.wikipedia.org/wiki/Rojo_y_negro", "autores": ["Stendhal"], "pais": ["Francia"], "tematica": ["literatura"], "temas": ["ascenso social", "hip let orden={k:"titulo",d:1};
function catalogo(){const v=x=>Array.isArray(x)?x.join(", "):(x||"");
 const ls=L.filter(pasa).sort((a,b)=>orden.d*String(v(a[orden.k])).localeCompare(String(v(b[orden.k])),"es",{numeric:true}));
 $("#filas").innerHTML=ls.map(b=>`<tr data-id="${b.id}"><td><i>${esc(b.titulo)}</i></td><td>${esc(b.autores.join(", "))}</td><td>${esc(b.pais.join(", "))}</td><td>${esc(b.año)}</td><td>${esc(b.genero)}</td><td>${esc(b.estado)}</td></tr>`).join("")}
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{orden={k:th.dataset.k,d:orden.k===th.dataset.k?-orden.d:1};catalogo()});
// mapa
const porPais={};propios.concat(L.filter(b=>b.lista!=="Libros")).forEach(b=>b.pais.forEach(p=>(porPais[p]=porPais[p]||[]).push(b)));
const maxN=Math.max(1,...Object.values(porPais).map(x=>x.filter(b=>b.lista==="Libros").length));
document.querySelectorAll("#mapa .con").forEach(p=>{const ps=JSON.parse(p.dataset.paises);const n=ps.reduce((s,x)=>s+(porPais[x]||[]).filter(b=>b.lista==="Libros").length,0);
 p.style.fill=n?ESC[Math.min(4,Math.round((n-1)/Math.max(1,maxN-1)*4))]:"#e3cfa6";p.dataset.n=n;
 p.onmousemove=e=>{const t=$("#tip");t.style.display="block";t.style.left=e.clientX+12+"px";t.style.top=e.clientY+12+"px";t.textContent=`${p.dataset.nombre}: ${n} libro${n===1?"":"s"}`};
 p.onmouseleave=()=>$("#tip").style.display="none";
 p.onclick=()=>{document.querySelectorAll("#mapa .sel").forEach(x=>x.classList.remove("sel"));p.classList.add("sel");panelPais(ps,p.dataset.nombre)}});
function panelPais(ps,nombre){const libs=ps.flatMap(x=>porPais[x]||[]);const aut={};libs.forEach(b=>b.autores.forEach(a=>(aut[a]=aut[a]||[]).push(b)));
 $("#panel").innerHTML=`<h3>${esc(nombre)}</h3><div class="leyenda">${libs.filter(b=>b.lista==="Libros").length} en la biblioteca · ${libs.filter(b=>b.lista!=="Libros").length} por adquirir</div>`+
 Object.entries(aut).sort().map(([a,bs])=>{const x=A[a]||{};const vida=x.nacimiento?` (${x.nacimiento}–${x.muerte||""})`:"";
 return `<div class="autor"><b>${esc(a)}</b><span class="leyenda">${esc(vida)}</span><ul>`+bs.map(b=>`<li data-id="${b.id}"><i>${esc(b.titulo)}</i>${b.lista!=="Libros"?" · por adquirir":""}</li>`).join("")+"</ul></div>"}).join("")}
const mapaSvg=$("#mapa"), vbMundo=mapaSvg.getAttribute("viewBox");
$("#zMundo").onclick=()=>mapaSvg.setAttribute("viewBox",vbMundo);$("#zEuropa").onclick=()=>mapaSvg.setAttribute("viewBox",mapaSvg.dataset.europa);
// ficha
function ficha(id){const b=L[id];const aut=b.autores.map(a=>{const x=A[a]||{};return x.wikipedia?`<a href="${esc(x.wikipedia)}" target="_blank" rel="noopener">${esc(a)}</a>`:esc(a)}).join(", ")||"Autor no registrado";
 const est=b.calificacion?`<span class="estrellas">${"★".repeat(+b.calificacion)}${"☆".repeat(5-+b.calificacion)}</span>`:"";
 const fila=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:"";
 $("#ficha").innerHTML=`<button class="cerrar" aria-label="Cerrar">×</button><div class="sig">N.º ${String(b.id+1).padStart(3,"0")}</div>
 <h3>${esc(b.titulo)}</h3><div class="aut">${aut}</div><dl>${fila("País",esc(b.pais.join(", ")))}${fila("Publicado",esc(b.año))}${fila("Género",esc(b.genero))}
 ${fila("Temática",esc(b.tematica.join(", ")))}${fila("Estado",esc(b.estado))}${fila("Calificación",est)}${fila("Editorial",esc(b.editorial))}
 ${fila("Edición",esc(b.año_edicion))}${fila("Páginas",esc(b.paginas))}${fila("ISBN",esc(b.isbn))}</dl>
 ${b.resumen_ia?`<div class="res">${esc(b.resumen_ia)}</div>`:'<div class="res"><i>Sin resumen todavía.</i></div>'}
 <div>${b.temas.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
 ${b.fuente_resumen?`<div style="font-size:12px">Fuente: <a href="${esc(b.fuente_resumen)}" target="_blank" rel="noopener">${esc(decodeURIComponent(b.fuente_resumen.split("/").pop()).replace(/_/g," "))}</a></div>`:""}`;
 $("#velo").classList.add("abierto");$("#ficha .cerrar").focus()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-id]");if(t&&!e.target.closest(".ficha"))ficha(+t.dataset.id);
 if(e.target.id==="velo"||e.target.closest(".cerrar"))$("#velo").classList.remove("abierto")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#velo").classList.remove("abierto");if(e.key==="Enter"&&e.target.classList.contains("lomo"))ficha(+e.target.dataset.id)});
// navegación y filtros
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,.seccion").forEach(x=>x.classList.remove("activo","activa"));b.classList.add("activo");$("#"+b.dataset.s).classList.add("activa")});
["#q","#fEstado","#fTema","#fGenero","#fPais"].forEach(s=>$(s).addEventListener("input",()=>{estanteria();catalogo()}));
estanteria();catalogo();
</script></body></html>
